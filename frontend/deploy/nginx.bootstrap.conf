# Bootstrap config: HTTP only, used ONCE to obtain the first Let's Encrypt certificate
# (before the real cert files exist, so nginx.conf's `ssl_certificate` directives would
# fail to start). Serves the app over plain HTTP in the meantime. See docs/DEPLOYMENT.md.

server {
    listen 80;
    server_name ai.alliedsoftwareengineers.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 20m;

    location /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
