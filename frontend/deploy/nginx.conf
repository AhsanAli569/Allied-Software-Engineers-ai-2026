# Production config: HTTPS + static SPA + reverse-proxied API.
# Requires certs to already exist at /etc/letsencrypt/live/<domain>/ — see
# docs/DEPLOYMENT.md for the certbot bootstrap step (use nginx.bootstrap.conf first).

server {
    listen 80;
    server_name ai.alliedsoftwareengineers.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai.alliedsoftwareengineers.com;

    ssl_certificate     /etc/letsencrypt/live/ai.alliedsoftwareengineers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.alliedsoftwareengineers.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Enable HSTS only after confirming HTTPS works end-to-end for a while — it's
    # hard to walk back once browsers have cached it.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 20m;

    location /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # SSE streaming needs buffering disabled and generous timeouts, or nginx queues
    # the whole response server-side and the client sees nothing until it's all done.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
