# Optional convenience: Render "Blueprint" for one-click backend provisioning
# (New -> Blueprint in the Render dashboard, point it at this repo).
# If blueprint parsing ever fails due to a Render schema change, just create the web
# service manually instead — see docs/DEPLOYMENT_NETLIFY_RENDER.md, which is the
# authoritative, manually-verified path.
services:
  - type: web
    name: ase-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false # paste your Neon connection string after creating the service
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: CORS_ORIGINS
        sync: false # your deployed frontend origin, exact match, no trailing slash —
        # e.g. https://ai.alliedsoftwareengineers.com (or https://your-app.netlify.app)
      - key: COOKIE_SAMESITE
        value: none
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RATE_LIMIT_AUTH_PER_MINUTE
        value: "10"
      - key: RATE_LIMIT_CHAT_PER_MINUTE
        value: "30"
      - key: RATE_LIMIT_UPLOAD_PER_MINUTE
        value: "20"
      - key: STORAGE_DIR
        value: ./storage
      - key: MAX_IMAGE_SIZE_MB
        value: "10"
      - key: MAX_DOCUMENT_SIZE_MB
        value: "20"
      - key: MAX_ATTACHMENTS_PER_MESSAGE
        value: "5"
